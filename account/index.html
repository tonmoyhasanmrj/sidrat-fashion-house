<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার একাউন্ট | সিদরাত ফ্যাশন হাউস</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1E3C; --maroon-dark:#3E0F22; --gold:#C9974D; --gold-light:#E8CFA0;
  --cream:#FBF6F0; --blush:#F3E1DD; --charcoal:#2B2320; --rose:#A85C6B; --white:#fff;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Hind Siliguri',sans-serif; background:var(--cream); color:var(--charcoal); padding:20px;}
a{color:var(--maroon);}
h1{font-family:'Tiro Bangla',serif; color:var(--maroon); font-weight:400; margin-bottom:6px;}
.sub{color:var(--rose); font-size:0.9rem; margin-bottom:24px;}
.top-link{display:block; max-width:420px; margin:0 auto 14px; text-align:center; font-size:0.9rem;}

.auth-box{
  max-width:420px; margin:40px auto; background:var(--white); padding:28px;
  border-radius:14px; box-shadow:0 8px 24px rgba(59,15,30,0.1);
}
.tabs{display:flex; gap:8px; margin-bottom:20px;}
.tab-btn{
  flex:1; padding:10px; border-radius:10px; background:var(--blush); color:var(--maroon);
  font-weight:600; font-size:0.92rem; cursor:pointer; border:none;
}
.tab-btn.active{background:var(--maroon); color:var(--gold-light);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.85rem; font-weight:600; color:var(--charcoal); margin-bottom:6px;}
.field input{
  width:100%; padding:11px 14px; border:1.5px solid var(--blush); border-radius:10px;
  font-size:0.95rem; font-family:inherit;
}
.field input:focus{outline:none; border-color:var(--gold);}
.submit-btn{
  width:100%; background:var(--maroon); color:var(--gold-light); border:none; padding:12px 24px;
  border-radius:24px; font-weight:700; font-size:0.95rem; cursor:pointer; margin-top:6px;
}
.submit-btn:hover{background:var(--maroon-dark);}
.submit-btn:disabled{opacity:0.6; cursor:default;}
.form-error{color:#c0392b; text-align:center; margin-top:12px; font-size:0.88rem; min-height:1em;}
.form-panel{display:none;}
.form-panel.active{display:block;}
.hint{font-size:0.78rem; color:var(--rose); margin-top:4px;}

#dashboard{display:none; max-width:640px; margin:0 auto;}
.top-bar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
.logout-btn{
  background:var(--white); color:var(--maroon); border:1.5px solid var(--maroon); padding:9px 18px;
  border-radius:20px; font-weight:600; font-size:0.85rem; cursor:pointer;
}
.logout-btn:hover{background:var(--blush);}
.welcome-card{
  background:var(--white); border-radius:14px; padding:18px 20px; margin-bottom:20px;
  box-shadow:0 3px 12px rgba(59,15,30,0.07);
}
.welcome-card b{color:var(--maroon);}

.order-card{
  background:var(--white); border-radius:12px; padding:18px 20px; margin-bottom:14px;
  box-shadow:0 3px 12px rgba(59,15,30,0.07); border-left:4px solid var(--gold);
}
.order-head{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
.order-id{font-weight:700; color:var(--maroon); font-size:1.05rem;}
.order-date{color:var(--rose); font-size:0.8rem;}
.items-list{font-size:0.88rem; background:var(--cream); border-radius:8px; padding:10px 14px; margin-bottom:10px;}
.items-list div{padding:2px 0;}
.order-total{font-weight:700; color:var(--maroon); font-size:1rem;}
.status-badge{
  display:inline-block; margin-top:10px; padding:6px 16px; border-radius:16px; font-size:0.85rem;
  font-weight:600; background:var(--blush); color:var(--maroon);
}
.empty{text-align:center; padding:60px 20px; color:var(--rose);}
</style>
</head>
<body>

<a class="top-link" href="/">← দোকানে ফিরে যান</a>

<!-- ===== লগইন / রেজিস্ট্রেশন ===== -->
<div class="auth-box" id="authBox">
  <h1>👤 আমার একাউন্ট</h1>
  <p class="sub">লগইন করুন অথবা নতুন একাউন্ট খুলুন</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabLogin">লগইন</button>
    <button class="tab-btn" id="tabRegister">নতুন একাউন্ট</button>
  </div>

  <!-- লগইন ফর্ম -->
  <form class="form-panel active" id="loginForm">
    <div class="field">
      <label>ফোন নম্বর</label>
      <input type="tel" id="loginPhone" placeholder="01xxxxxxxxx" required>
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="loginPassword" required>
    </div>
    <button type="submit" class="submit-btn" id="loginSubmit">লগইন করুন</button>
    <p class="form-error" id="loginError"></p>
  </form>

  <!-- রেজিস্ট্রেশন ফর্ম -->
  <form class="form-panel" id="registerForm">
    <div class="field">
      <label>নাম</label>
      <input type="text" id="regName" required>
    </div>
    <div class="field">
      <label>ফোন নম্বর</label>
      <input type="tel" id="regPhone" placeholder="01xxxxxxxxx" required>
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="regPassword" required>
      <p class="hint">অন্তত ৬ ক্যারেক্টার</p>
    </div>
    <button type="submit" class="submit-btn" id="registerSubmit">একাউন্ট খুলুন</button>
    <p class="form-error" id="registerError"></p>
  </form>
</div>

<!-- ===== লগইন করা কাস্টমারের ড্যাশবোর্ড ===== -->
<div id="dashboard">
  <div class="top-bar">
    <div>
      <h1>আমার অর্ডার</h1>
      <p class="sub" id="orderCount"></p>
    </div>
    <button class="logout-btn" id="logoutBtn">লগ-আউট</button>
  </div>
  <div class="welcome-card">
    স্বাগতম, <b id="welcomeName"></b>! (<span id="welcomePhone"></span>)
  </div>
  <div id="ordersContainer"></div>
</div>

<script>
const $ = s => document.querySelector(s);
function fmt(n){ return '৳' + Number(n).toLocaleString('en-US'); }
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

/* ---------- ট্যাব সুইচ ---------- */
$('#tabLogin').addEventListener('click', () => switchTab('login'));
$('#tabRegister').addEventListener('click', () => switchTab('register'));
function switchTab(which){
  $('#tabLogin').classList.toggle('active', which === 'login');
  $('#tabRegister').classList.toggle('active', which === 'register');
  $('#loginForm').classList.toggle('active', which === 'login');
  $('#registerForm').classList.toggle('active', which === 'register');
}

/* ---------- লগইন ---------- */
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#loginError').textContent = '';
  $('#loginSubmit').disabled = true;
  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        phone: $('#loginPhone').value.trim(),
        password: $('#loginPassword').value
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      $('#loginError').textContent = data.error || 'লগইন করা যায়নি, আবার চেষ্টা করুন';
      return;
    }
    checkSession();
  }catch(e){
    $('#loginError').textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন';
  }finally{
    $('#loginSubmit').disabled = false;
  }
});

/* ---------- রেজিস্ট্রেশন ---------- */
$('#registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#registerError').textContent = '';
  $('#registerSubmit').disabled = true;
  try{
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: $('#regName').value.trim(),
        phone: $('#regPhone').value.trim(),
        password: $('#regPassword').value
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      $('#registerError').textContent = data.error || 'একাউন্ট খোলা যায়নি, আবার চেষ্টা করুন';
      return;
    }
    checkSession();
  }catch(e){
    $('#registerError').textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন';
  }finally{
    $('#registerSubmit').disabled = false;
  }
});

/* ---------- লগ-আউট ---------- */
$('#logoutBtn').addEventListener('click', async () => {
  try{ await fetch('/api/logout', {method:'POST'}); }catch(e){}
  location.reload();
});

/* ---------- সেশন চেক করে ড্যাশবোর্ড বা লগইন ফর্ম দেখানো ---------- */
async function checkSession(){
  try{
    const res = await fetch('/api/me', {cache:'no-store'});
    const data = await res.json();
    if(data.loggedIn){
      $('#authBox').style.display = 'none';
      $('#dashboard').style.display = 'block';
      $('#welcomeName').textContent = data.user.name;
      $('#welcomePhone').textContent = data.user.phone;
      renderOrders(data.orders || []);
    } else {
      $('#authBox').style.display = 'block';
      $('#dashboard').style.display = 'none';
    }
  }catch(e){
    $('#authBox').style.display = 'block';
  }
}

function renderOrders(orders){
  $('#orderCount').textContent = `মোট ${orders.length}টা অর্ডার`;
  const container = $('#ordersContainer');
  if(orders.length === 0){
    container.innerHTML = `<div class="empty">🛍️<br>আপনি এখনো কোনো অর্ডার করেননি।</div>`;
    return;
  }
  container.innerHTML = orders.map(o => {
    let items = [];
    try{ items = JSON.parse(o.items); }catch(e){}
    const itemsHtml = items.map(i => `<div>• ${escapeHtml(i.name)} (${escapeHtml(i.size)}) × ${i.qty} = ${fmt(i.price*i.qty)}</div>`).join('');
    const date = new Date(o.created_at).toLocaleString('bn-BD', {dateStyle:'medium', timeStyle:'short'});
    return `
      <div class="order-card">
        <div class="order-head">
          <span class="order-id">#${o.id}</span>
          <span class="order-date">${date}</span>
        </div>
        <div class="items-list">${itemsHtml}</div>
        <div class="order-total">সর্বমোট: ${fmt(o.total)}</div>
        <span class="status-badge">স্ট্যাটাস: ${escapeHtml(o.status)}</span>
      </div>
    `;
  }).join('');
}

checkSession();
</script>
</body>
</html>
