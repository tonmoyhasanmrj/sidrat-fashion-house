backend:
  name: github
  repo: tonmoyhasanmrj/sidrat-fashion-house   # আপনার GitHub ইউজারনেম/রিপোর নাম — ইতিমধ্যে ঠিক আছে
  branch: main
  base_url: https://YOUR-SITE-NAME.pages.dev  # ⚠️ Cloudflare Pages থেকে পাওয়া আসল লিংক দিয়ে এটা বদলান
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "en"

collections:
  - name: "products"
    label: "প্রোডাক্ট তালিকা"
    files:
      - file: "content/products.json"
        label: "সব প্রোডাক্ট"
        name: "products"
        fields:
          - label: "প্রোডাক্টসমূহ"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — ৳{{fields.price}}"
            fields:
              - {label: "ID (ইউনিক নাম্বার)", name: "id", widget: "number", value_type: "int", hint: "প্রতিটা প্রোডাক্টের জন্য আলাদা নাম্বার দিন, যেমন 13, 14..."}
              - {label: "প্রোডাক্টের নাম", name: "name", widget: "string"}
              - label: "ক্যাটাগরি"
                name: "cat"
                widget: "select"
                options: ["শাড়ি", "থ্রি-পিস", "কুর্তি", "ওড়না", "এক্সেসরিজ"]
              - {label: "দাম (৳)", name: "price", widget: "number", value_type: "int"}
              - {label: "আগের দাম (ঐচ্ছিক, ডিসকাউন্ট দেখানোর জন্য)", name: "oldPrice", widget: "number", value_type: "int", required: false}
              - label: "সাইজ (একাধিক সিলেক্ট করা যাবে)"
                name: "sizes"
                widget: "select"
                multiple: true
                options: ["ফ্রি সাইজ", "S", "M", "L", "XL"]
                default: ["ফ্রি সাইজ"]
              - {label: "ছবি", name: "img", widget: "image", required: false, hint: "ছবি না দিলে সুন্দর ডিজাইনার প্লেসহোল্ডার দেখাবে"}
              - {label: "বিবরণ", name: "desc", widget: "text"}
              - {label: "\"নতুন\" ব্যাজ দেখাবে?", name: "isNew", widget: "boolean", default: false}
